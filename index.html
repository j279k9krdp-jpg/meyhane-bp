<style type="text/css">

.rewardgrid{width:100%;height:78%;table-layout:fixed}.rewardgrid td{padding:4px}.rcard{height:100%;background:#0a1720;border:1px solid #29495d;text-align:center}

.weekbox{height:74%;background:#0a1720;border:1px solid #29495d;padding:12px}.weektitle{font-size:18px;color:#f0c563;font-weight:bold}
.weekbar{height:12px;background:#030a10;border:1px solid #37576a;margin:10px 0}.weekfill{height:100%;background:#37c962}
.profile{width:100%;height:78%;table-layout:fixed}.profile td{padding:5px;vertical-align:top}.pcard{height:100%;background:#0a1720;border:1px solid #29495d;padding:12px}
.pcard h3{color:#f0c563;font-size:15px}.prow{padding:8px 0;border-bottom:1px solid #1d3546}.pk{color:#819aaa}.pv{float:right;color:#fff;font-weight:bold}
.identity{width:100%;table-layout:fixed;margin-bottom:5px}.avatarcell{width:88px}
.avatar{width:78px;height:78px;border:2px solid #bd8b31;background:#071019;display:block}
.avatarfallback{width:78px;height:78px;line-height:78px;text-align:center;border:2px solid #31536a;background:#0b2130;color:#63d4ff;font-weight:bold;font-size:10px}
.steamtag{display:inline-block;margin-top:4px;padding:2px 5px;border:1px solid #31536a;background:#0a2537;color:#63d4ff;font-size:8px;font-weight:bold}
.rankhero{text-align:center;background:#101e29;border:1px solid #38566a;padding:7px;margin-bottom:5px}.ranknum{font-size:27px;font-weight:bold;color:#f0c563}.ranklabel{font-size:9px;color:#8ba3b2;font-weight:bold}
.topbadge{display:inline-block;margin-left:5px;padding:2px 5px;background:#51390e;border:1px solid #a37628;color:#ffdc7e;font-size:8px}
.statgrid{width:100%;table-layout:fixed}.statgrid td{padding:5px;border:1px solid #1f3b4d;background:#08141d;text-align:center}
.statlabel{display:block;color:#7994a7;font-size:8px;font-weight:bold}.statval{display:block;color:#fff;font-size:13px;font-weight:bold;margin-top:2px}
.footer{height:5%;background:#02090f;border-top:1px solid #76531f;color:#7791a3}.footer td{padding:0 7px;font-size:9px}
.zoom a,.zval{display:inline-block;margin-left:3px;padding:2px 6px;border:1px solid #31546b;background:#0a2537;color:#67d3ff;font-weight:bold}.zoom .za{color:#f1c565;border-color:#725522;background:#271c08}
</style>
<script type="text/javascript">
var CFG=[
 {r:150,t:[["35 Dusman Oldur",35,"KILL"],["5 Headshot Vur",5,"HS"],["60 Dakika Aktif Kal",60,"DK"]]},
 {r:200,t:[["50 Dusman Oldur",50,"KILL"],["Deagle ile 5 Headshot",5,"DEAGLE"],["45 Dakika Aktif Kal",45,"DK"]]},
 {r:250,t:[["25.000 Hasar Ver",25000,"DMG"],["60 Dakika Aktif Kal",60,"DK"]]},
 {r:300,t:[["2 Kez Bomba Kur",2,"C4"],["10 Headshot Vur",10,"HS"],["45 Dakika Aktif Kal",45,"DK"]]},
 {r:350,t:[["2 Kez C4 Coz",2,"DEF"],["10 Headshot Vur",10,"HS"],["30 Dakika Aktif Kal",30,"DK"]]},
 {r:500,t:[["3 Bicak Killi",3,"KNF"],["120 Dakika Aktif Kal",120,"DK"]]},
 {r:500,t:[["100 Dusman Oldur",100,"KILL"],["120 Dakika Aktif Kal",120,"DK"]]}
];
var DN=["PZT","SAL","CRS","PRS","CUM","CMT","PAZ"];
function esc(s){s=String(s);return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
function qp(){
 var q={},a=location.search.length>1?location.search.substring(1).split("&"):[];
 for(var i=0;i<a.length;i++){var x=a[i].split("="),k=decodeURIComponent(x[0]||""),v=decodeURIComponent((x.slice(1).join("=")||"").replace(/\+/g," "));q[k]=v;}
 return q;
}
function ni(v,d){var n=parseInt(v,10);return isNaN(n)?d:n;}
function clamp(v,a,b){return v<a?a:(v>b?b:v);}
function bit(m,i){return (m&(1<<i))!=0;}
function pc(v,m){return m>0?clamp(Math.floor(v*100/m),0,100):0;}
function nf(n){n=String(Math.max(0,ni(n,0)));var r="",c=0;for(var i=n.length-1;i>=0;i--){if(c&&c%3==0)r="."+r;r=n.charAt(i)+r;c++;}return r;}
function build(ch){
 var q=qp(),k,a=[];for(k in ch)if(ch.hasOwnProperty(k))q[k]=ch[k];
 for(k in q)if(q.hasOwnProperty(k))a.push(encodeURIComponent(k)+"="+encodeURIComponent(q[k]));
 return location.pathname+"?"+a.join("&");
}
function weekDone(wm){var n=0;for(var i=0;i<7;i++)if(bit(wm,i))n++;return n;}
function xhrJSON(url,ok,fail){
 try{
  var x=new XMLHttpRequest();
  x.onreadystatechange=function(){
   if(x.readyState==4){
    if(x.status>=200&&x.status<300){
     try{var o=(window.JSON&&JSON.parse)?JSON.parse(x.responseText):eval("("+x.responseText+")");ok(o);}catch(e){fail();}
    }else fail();
   }
  };
  x.open("GET",url,true);x.send(null);
 }catch(e){fail();}
}
function renderSteam(q){
 var box=document.getElementById("steamBox"); if(!box)return;
 var sid=q.sid||"", isSteam=ni(q.steam,0)==1;
 if(!isSteam || sid.indexOf("STEAM_")!==0){
  box.innerHTML="<table class='identity'><tr><td class='avatarcell'><div class='avatarfallback'>NO-STEAM</div></td><td><h3 style='margin:0 0 4px 0'>"+esc((q.name||"OYUNCU").replace(/_/g," "))+"</h3><div class='steamtag'>VALVE / NO-STEAM</div></td></tr></table>";
  return;
 }
 box.innerHTML="<table class='identity'><tr><td class='avatarcell'><div class='avatarfallback'>STEAM</div></td><td><h3 style='margin:0 0 4px 0'>"+esc((q.name||"OYUNCU").replace(/_/g," "))+"</h3><div class='steamtag'>STEAM PROFILI YUKLENIYOR</div></td></tr></table>";
 xhrJSON("https://steamgpt.net/profile/"+encodeURIComponent(sid)+".json",function(o){
  try{
   if(o&&o.result=="success"&&o.data&&o.data.steam){
    var st=o.data.steam,av=st.avatarfull||st.avatarmedium||st.avatar||"";
    var img=av?"<img class='avatar' src='"+esc(av)+"' alt='Steam'>":"<div class='avatarfallback'>STEAM</div>";
    box.innerHTML="<table class='identity'><tr><td class='avatarcell'>"+img+"</td><td><h3 style='margin:0 0 4px 0'>"+esc(st.personaname||((q.name||"OYUNCU").replace(/_/g," ")))+"</h3><div class='steamtag'>STEAM OYUNCUSU</div><div class='pk' style='margin-top:4px'>"+esc(sid)+"</div></td></tr></table>";
   }
  }catch(e){}
 },function(){
  box.innerHTML="<table class='identity'><tr><td class='avatarcell'><div class='avatarfallback'>STEAM</div></td><td><h3 style='margin:0 0 4px 0'>"+esc((q.name||"OYUNCU").replace(/_/g," "))+"</h3><div class='steamtag'>STEAM PROFILI ALINAMADI</div></td></tr></table>";
 });
}
function render(){
 var q=qp(),name=(q.name||"OYUNCU").replace(/_/g," "),coin=Math.max(0,ni(q.coin,0)),today=clamp(ni(q.today,0),0,6),day=clamp(ni(q.day,today),0,6);
 var wm=Math.max(0,ni(q.wm,0)),dm=Math.max(0,ni(q.dm,0)),wb=ni(q.wb,0)?1:0,dr=q.dr||"-",wr=q.wr||"-",tab=q.tab||"v1";
 if(tab!="v1"&&tab!="rewards"&&tab!="week"&&tab!="profile")tab="v1";
 var rank=Math.max(0,ni(q.rank,0)),rt=Math.max(0,ni(q.rtotal,0)),rk=Math.max(0,ni(q.rk,0)),rd=Math.max(0,ni(q.rd,0)),rhs=Math.max(0,ni(q.rhs,0)),shots=Math.max(0,ni(q.rshots,0)),hits=Math.max(0,ni(q.rhits,0)),dmg=Math.max(0,ni(q.rdmg,0));
 var kd=rd>0?(rk/rd):rk,acc=shots>0?(hits*100/shots):0,hsr=rk>0?(rhs*100/rk):0,wd=weekDone(wm),p=[],i;
 for(i=0;i<21;i++)p[i]=Math.max(0,ni(q["p"+i],0));

 document.getElementById("pname").innerHTML=esc(name);
 document.getElementById("coin").innerHTML=nf(coin);
 document.getElementById("weekdone").innerHTML=wd+"/7";

 var tabs=["v1","rewards","week","profile"],labs=["GUNLUK GOREVLER","ODUL YOLU","HAFTALIK","PROFIL"],th="";
 for(i=0;i<4;i++)th+="<td><a class='"+(tab==tabs[i]?"active":"")+"' href='"+esc(build({tab:tabs[i]}))+"'>"+labs[i]+"</a></td>";
 document.getElementById("tabs").innerHTML=th;

 var h="";
 if(tab=="v1"){
  h+="<table class='daystrip' width='100%' cellspacing='2' cellpadding='0'><tr>";
  for(i=0;i<7;i++){
   var cls="daybtn"; if(i==day)cls+=" sel"; else if(bit(wm,i))cls+=" done"; else if(i<today)cls+=" miss"; else if(i>today)cls+=" lock";
   var st=bit(wm,i)?"TAMAM":(i==today?"BUGUN":(i<today?"KACIRILDI":"KILITLI"));
   h+="<td width='14%'><a class='"+cls+"' href='"+esc(build({day:i,tab:"v1"}))+"'><b>"+(i+1)+". GUN / "+DN[i]+"</b>"+st+"</a></td>";
  }
  h+="</tr></table>";
  h+="<table class='head' width='100%' cellspacing='0' cellpadding='0'><tr><td><span class='ttl'>"+(day+1)+". GUN GOREVLERI</span><span class='sub'>"+(day==today?"AKTIF GUN":(day<today?"GECMIS GUN":"GELECEK GUN"))+"</span></td><td align='right'><span class='sub'>GUNLUK RESET:</span> <span class='reset'>"+esc(dr)+"</span></td></tr></table>";
  h+="<table class='qgrid' cellspacing='0' cellpadding='0'><tr>";
  var ts=CFG[day].t,cnt=ts.length;
  for(i=0;i<cnt;i++){
   var idx=day*3+i,pr=p[idx],tar=ts[i][1],pct=pc(pr,tar),locked=day>today,done=pr>=tar;
   h+="<td width='"+Math.floor(100/cnt)+"%'><div class='qcard'><div class='qtop'><div class='qicon'>"+ts[i][2]+"</div><div class='qtitle'>"+esc(ts[i][0])+"</div><div class='qdesc'>Hedef: "+nf(tar)+"</div></div><div class='qmid'><span class='qnum'>"+nf(pr)+"</span> <span class='qtarget'>/ "+nf(tar)+"</span><div class='prog'><div class='fill "+(done?"ok":"")+"' style='width:"+pct+"%'></div></div></div><div class='pill "+(done?"done":(locked?"lock":""))+"'>"+(done?"TAMAM":(locked?"KILITLI":"DEVAM"))+"</div></div></td>";
  }
  h+="</tr></table>";
  var dd=bit(wm,day),dc=bit(dm,day),state=dc?"ALINDI":(dd?"ODUL HAZIR":(day>today?"KILITLI":(day<today?"KACIRILDI":"DEVAM")));
  h+="<table class='dayreward' width='100%' cellspacing='0' cellpadding='0'><tr><td><span class='big'>"+(day+1)+". GUN ODULU: "+CFG[day].r+" COIN</span><br><span class='status'>Tum gorevleri bitir, odulu oyunda /bpmenu ile al.</span></td><td align='right'><span class='big "+(dd&&!dc?"ready":"")+"'>"+state+"</span></td></tr></table>";
 }else if(tab=="rewards"){
  h+="<table class='head' width='100%' cellspacing='0' cellpadding='0'><tr><td><span class='ttl'>7 GUNLUK ODUL YOLU</span><span class='sub'>TOPLAM 2250 COIN + HAFTALIK BONUS</span></td><td align='right'><span class='reset'>"+wd+"/7</span></td></tr></table><table class='rewardgrid' cellspacing='0' cellpadding='0'><tr>";
  for(i=0;i<7;i++){var cl=bit(dm,i),dn=bit(wm,i),rs=cl?"ALINDI":(dn?"ODUL HAZIR":(i>today?"KILITLI":(i<today?"KACIRILDI":"DEVAM")));h+="<td width='14%'><div class='rcard'><div class='rnum'>"+(i+1)+"</div><h3>"+DN[i]+"</h3><div class='coin'>"+CFG[i].r+" COIN</div><div class='rstate "+((dn||cl)?"open":"")+"'>"+rs+"</div></div></td>";}
  h+="</tr></table>";
 }else if(tab=="week"){
  h+="<table class='head' width='100%' cellspacing='0' cellpadding='0'><tr><td><span class='ttl'>HAFTALIK TAMAMLAMA</span></td><td align='right'><span class='reset'>"+esc(wr)+"</span></td></tr></table><div class='weekbox'><div class='weektitle'>"+wd+"/7 GUN TAMAMLANDI</div><div class='weekbar'><div class='weekfill' style='width:"+pc(wd,7)+"%'></div></div><p>Her gun kendi gorevlerini tamamla. 7 gunun tamamini bitirince ekstra <b class='gold'>1000 Coin</b> haftalik bonus acilir.</p><p>Gunluk oduller: <b class='gold'>150 + 200 + 250 + 300 + 350 + 500 + 500 Coin</b></p><p>Haftalik bonus durumu: <b class='"+(wb?"green":"blue")+"'>"+(wb?"ALINDI":(wd>=7?"ODUL HAZIR":"KILITLI"))+"</b></p></div>";
 }else{
  h+="<table class='head' width='100%' cellspacing='0' cellpadding='0'><tr><td><span class='ttl'>OYUNCU PROFILI</span><span class='sub'>STEAM + BATTLEPASS + SERVER TOP15</span></td></tr></table><table class='profile' cellspacing='0' cellpadding='0'><tr>";
  h+="<td width='40%'><div class='pcard'><div id='steamBox'></div><div class='prow'><span class='pk'>Coin</span><span class='pv gold'>"+nf(coin)+"</span></div><div class='prow'><span class='pk'>Bugun</span><span class='pv blue'>"+(today+1)+". Gun</span></div><div class='prow'><span class='pk'>Haftalik BP</span><span class='pv green'>"+wd+"/7</span></div><div class='prow'><span class='pk'>Gunluk Reset</span><span class='pv blue'>"+esc(dr)+"</span></div><div class='prow'><span class='pk'>Hafta Sonu</span><span class='pv'>"+esc(wr)+"</span></div></div></td>";
  h+="<td width='60%'><div class='pcard'><h3>SERVER TOP15 ISTATISTIKLERI</h3><div class='rankhero'><span class='ranklabel'>SIRALAMA</span><br><span class='ranknum'>"+(rank>0?("#"+nf(rank)):"-")+"</span> <span class='ranklabel'>/ "+nf(rt)+"</span>"+(rank>0&&rank<=15?"<span class='topbadge'>TOP 15</span>":"")+"</div><table class='statgrid' cellspacing='3' cellpadding='0'><tr><td><span class='statlabel'>KILL</span><span class='statval gold'>"+nf(rk)+"</span></td><td><span class='statlabel'>DEATH</span><span class='statval'>"+nf(rd)+"</span></td><td><span class='statlabel'>HEADSHOT</span><span class='statval blue'>"+nf(rhs)+"</span></td></tr><tr><td><span class='statlabel'>K/D</span><span class='statval'>"+kd.toFixed(2)+"</span></td><td><span class='statlabel'>ISABET</span><span class='statval'>"+acc.toFixed(1)+"%</span></td><td><span class='statlabel'>HS ORANI</span><span class='statval'>"+hsr.toFixed(1)+"%</span></td></tr><tr><td colspan='3'><span class='statlabel'>TOPLAM HASAR</span><span class='statval green'>"+nf(dmg)+"</span></td></tr></table></div></td></tr></table>";
 }
 document.getElementById("content").innerHTML=h;
 document.getElementById("vptext").innerHTML="GITHUB PAGES";
 if(tab=="profile")renderSteam(q);
}
</script>
